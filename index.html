      margin-bottom:40px;
      transition:.3s;
    }

    .card:hover{
      transform:translateY(-5px);
      border-color:#7c3aed;
    }

    .dot{

      width:24px;
      height:24px;

    .orange{ background:#ff7b39; }

      }

      }

      }

      }

      }
    }

</head>
